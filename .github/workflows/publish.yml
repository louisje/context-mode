name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.5
          registry-url: 'https://npm.pkg.github.com'
          scope: '@louisje'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build (tsc + bundle + assert-bundle + assert-asymmetric-drift)
        run: npm run build

      - name: Run tests (non-blocking — upstream has pre-existing failures unrelated to this fork's changes)
        run: npm test
        continue-on-error: true

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
